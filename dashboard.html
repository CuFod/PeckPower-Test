<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PeakPower｜首页</title><link rel="stylesheet" href="peakpower.css"><style>
.dash-head{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:22px 24px}.greeting{margin:0 0 5px;font-weight:800;color:var(--primary-dark-color)}.fruit{padding:12px 16px;color:var(--white-color);font-weight:800;background:linear-gradient(135deg,var(--red-color),var(--orange-color));border-radius:16px;box-shadow:0 9px 20px var(--shadow-color)}.fruit strong{font-size:1.38rem}.dashboard-grid{display:grid;gap:20px;margin-top:20px}.overview,.weekly,.quick,.quote{padding:22px}.section-title{margin:0 0 14px;color:var(--primary-dark-color);font-size:1.15rem}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{min-height:140px;padding:16px;background:var(--glass-color);border-radius:16px}.stat:hover{transform:translateY(-4px);box-shadow:0 14px 24px var(--shadow-color)}.stat i{font-style:normal;font-size:1.55rem}.stat strong{display:block;margin:8px 0 3px;color:var(--primary-dark-color);font-size:2rem}.stat small{color:var(--muted-color);font-weight:800}.weekly{display:grid;grid-template-columns:175px 1fr;gap:24px;align-items:center}.rings{width:155px;aspect-ratio:1;display:grid;place-items:center;position:relative;border-radius:50%;background:conic-gradient(var(--wood-color) calc(var(--progress)*1%),var(--cream-color) 0)}.rings::before{width:123px;aspect-ratio:1;content:"";background:var(--wood-light-color);border:8px solid var(--wood-dark-color);border-radius:50%;box-shadow:inset 0 0 0 7px var(--wood-color)}.ring-text{position:absolute;text-align:center}.ring-text strong{display:block;color:var(--primary-dark-color);font-size:1.7rem}.ring-text span{font-size:.72rem;color:var(--muted-color)}.weekly h2{margin:0 0 8px;color:var(--primary-dark-color);font-size:1.15rem}.weekly p{margin:0;color:var(--muted-color);line-height:1.7}.encourage{margin-top:13px!important;color:var(--primary-color)!important;font-weight:800}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.quick-link{min-height:133px;padding:19px;color:var(--white-color);text-decoration:none;border-radius:18px}.quick-link:hover{transform:translateY(-4px);filter:brightness(1.05)}.quick-link:first-child{background:linear-gradient(135deg,var(--primary-dark-color),var(--primary-color))}.quick-link:last-child{background:linear-gradient(135deg,var(--orange-color),var(--red-color))}.quick-link span{font-size:1.8rem}.quick-link strong{display:block;margin:9px 0 4px;font-size:1.06rem}.quick-link small{opacity:.9}.quote{text-align:center;color:var(--muted-color);font-style:italic;line-height:1.7}.quote button{margin-left:8px;color:var(--primary-color);font-weight:800;background:transparent;border:0}@media(max-width:620px){.dash-head{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{min-height:120px;padding:11px}.stat strong{font-size:1.55rem}.weekly{grid-template-columns:1fr;justify-items:center;text-align:center}.quick-grid{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="dash-head wood-card"><div><p class="greeting">下午好，继续稳稳啄食 🌲</p><h1 class="page-title" id="name">PeakPower 学习者</h1></div><div class="fruit">🍎 果实仓库：<strong id="fruit">0</strong> 颗</div></header><div class="dashboard-grid"><section class="overview glass-card"><h2 class="section-title">今日概览</h2><div class="stats"><article class="stat hover-lift"><i>🐛</i><strong id="today-words">0</strong><small>今日啄掉 只害虫</small></article><article class="stat hover-lift"><i>🪵</i><strong id="focus-minutes">0</strong><small>专注啄食 分钟</small></article><article class="stat hover-lift"><i>🕳️</i><strong id="todo-left">0</strong><small>待填树洞 个</small></article></div></section><section class="weekly wood-card"><div id="rings" class="rings" style="--progress:0"><div class="ring-text"><strong id="week-percent">0%</strong><span>年轮进度</span></div></div><div><h2>本周背词进度</h2><p>本周已啄食 <b id="week-done">0</b>/100 个词。每记住一个词，你就离目标更近一步。</p><p id="encourage" class="encourage"></p></div></section><section class="quick glass-card"><h2 class="section-title">快速开始</h2><div class="quick-grid"><a class="quick-link" href="index.html"><span>🌲</span><strong>继续背单词</strong><small>从上次中断的地方开始</small></a><a class="quick-link" href="pomodoro-todo.html"><span>⏳</span><strong>开始专注</strong><small>进入番茄钟与待办</small></a></div></section><footer class="quote glass-card"><span id="quote"></span><button id="quote-button">换一句</button></footer></div></main><script src="peakpower.js"></script><script>
// PeckPower 逻辑：看板从共享状态生成三类实时统计。
PeakPower.mountGlobal('dashboard');const state=PeakPower.getState();const today=PeakPower.localDate();const minutes=state.sessions.filter(s=>s.status==='completed'&&s.date===today).reduce((sum,s)=>sum+s.durationMinutes,0);const todoLeft=state.todos.filter(t=>!t.completed).length;const week=Math.min(100,state.wordProgress.weeklyWords||68);function countUp(id,target,duration=900){const el=document.querySelector(id),start=performance.now();const tick=now=>{const p=Math.min(1,(now-start)/duration);el.textContent=Math.round(target*(1-(1-p)**3));if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}document.querySelector('#name').textContent=state.profile.name;countUp('#fruit',state.profile.points,1200);countUp('#today-words',state.wordProgress.masteredToday);countUp('#focus-minutes',minutes);countUp('#todo-left',todoLeft);countUp('#week-done',week);countUp('#week-percent',week,1100);requestAnimationFrame(()=>document.querySelector('#rings').style.setProperty('--progress',week));const cheers=['啄木鸟说：坚持就是胜利！','积小成多，滴水穿石。','笃！每天一小步，目标一大步。'];document.querySelector('#encourage').textContent=cheers[Math.floor(Math.random()*cheers.length)];const quotes=['啄木鸟不嫌树高，日积月累见真章。','笃！每天一小步，高考一大步。','积小成多，滴水穿石。','啄掉今天的难题，明天更轻松。','不积跬步，无以至千里。','每一个单词，都是你未来的垫脚石。','坚持啄食，终成大器。'];let qi=0;const showQuote=()=>document.querySelector('#quote').textContent=quotes[qi];document.querySelector('#quote-button').onclick=()=>{qi=(qi+1)%quotes.length;showQuote()};showQuote();
</script></body></html>
