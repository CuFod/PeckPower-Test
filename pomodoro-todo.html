<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PeakPower｜专注</title><link rel="stylesheet" href="peakpower.css"><style>
.focus-layout{display:grid;gap:20px}.focus-zone{padding:25px;text-align:center}.prey{margin:0 0 14px;color:var(--primary-dark-color);font-weight:900}.prey strong{color:var(--red-color)}.ring-wrap{width:min(76vw,330px);aspect-ratio:1;margin:auto;position:relative;display:grid;place-items:center}.ring-wrap svg{width:100%;height:100%;rotate:-90deg}.ring-bg,.ring-value{fill:none;stroke-width:13}.ring-bg{stroke:var(--wood-light-color)}.ring-value{stroke:var(--wood-dark-color);stroke-linecap:round;stroke-dasharray:553;stroke-dashoffset:553;transition:stroke-dashoffset .8s linear}.ring-inner{position:absolute;display:grid;place-items:center}.timer-bird{font-size:2.3rem}.timer-bird.pecking{animation:tinyPeck .5s ease-in-out infinite}.timer{margin-top:5px;color:var(--primary-dark-color);font-family:ui-monospace,monospace;font-size:clamp(3.6rem,12vw,5.8rem);font-weight:900;letter-spacing:-.12em}@keyframes tinyPeck{50%{transform:translateX(8px) rotate(9deg)}}.controls{display:flex;justify-content:center;gap:10px;margin-top:18px}.controls button,.add-form button,.start-task{padding:11px 16px;color:var(--white-color);font-weight:900;border:0;border-radius:13px}.start{background:var(--primary-color)}.pause{background:var(--orange-color)}.reset{background:var(--muted-color)}.focus-total{margin:15px 0 0;color:var(--muted-color);font-weight:800}.todo-zone{padding:23px}.todo-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.todo-head h2{margin:0;color:var(--primary-dark-color);font-size:1.2rem}.todo-list{display:grid;gap:10px;margin:16px 0}.todo{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:13px;background:var(--glass-color);border-radius:15px}.todo.done{opacity:.58}.bug-icon{font-size:1.35rem}.todo-title{display:block;font-weight:900}.done .todo-title{text-decoration:line-through}.meta{margin-top:5px;color:var(--muted-color);font-size:.76rem}.priority{padding:2px 7px;color:var(--white-color);font-weight:900;border-radius:99px}.high{background:var(--red-color)}.medium{background:var(--orange-color)}.low{background:var(--teal-color)}.start-task{background:var(--teal-color)}.start-task:disabled{background:var(--muted-color);cursor:not-allowed}.add-form{display:grid;grid-template-columns:1fr 90px auto;gap:9px}.add-form input,.add-form select{min-width:0;padding:10px;color:var(--text-color);background:var(--cream-color);border:1px solid var(--wood-color);border-radius:11px}.add-form button{background:var(--primary-color)}@media(max-width:600px){.focus-zone,.todo-zone{padding:19px}.todo{grid-template-columns:auto 1fr}.start-task{grid-column:2}.add-form{grid-template-columns:1fr 76px}.add-form button{grid-column:span 2}}
</style></head><body><main class="page"><div class="focus-layout"><section class="focus-zone wood-card"><p id="prey" class="prey">当前猎物：<strong>自由专注</strong></p><div class="ring-wrap"><svg viewBox="0 0 200 200" aria-label="专注进度年轮"><circle class="ring-bg" cx="100" cy="100" r="88"></circle><circle id="ring" class="ring-value" cx="100" cy="100" r="88"></circle></svg><div class="ring-inner"><span id="timer-bird" class="timer-bird">🐦</span><output id="timer" class="timer">25:00</output></div></div><div class="controls"><button id="start" class="start">开始啄食</button><button id="pause" class="pause">暂停</button><button id="reset" class="reset">重置</button></div><p class="focus-total">今日已专注啄食 <strong id="total">0</strong> 分钟</p></section><section class="todo-zone glass-card"><div class="todo-head"><h2>🐛 今日猎物（待办任务）</h2><span id="todo-count" class="subtle"></span></div><div id="todos" class="todo-list"></div><form id="form" class="add-form"><input id="title" maxlength="80" placeholder="添加新猎物…" required><select id="priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select><button>添加新猎物</button></form></section></div></main><script src="peakpower.js"></script><script>
PeakPower.mountGlobal('focus');const $=s=>document.querySelector(s);const DURATION=25*60;let left=DURATION,timerId=null;const bugs=['🐛','🪲','🐜'];const makeId=()=>window.crypto?.randomUUID?.()||`task-${Date.now()}-${Math.random().toString(16).slice(2)}`;function state(){return PeakPower.getState()}function active(){const s=state();return s.todos.find(t=>t.id===s.activeTodoId)}function time(v){return`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}function renderTimer(){const ratio=1-left/DURATION;$('#timer').textContent=time(left);$('#ring').style.strokeDashoffset=553*(1-ratio);document.title=timerId?`${time(left)}｜PeakPower`:'PeakPower｜专注'}function todayMinutes(){const s=state(),today=PeakPower.localDate();return s.sessions.filter(x=>x.status==='completed'&&x.date===today).reduce((n,x)=>n+x.durationMinutes,0)}// PeckPower 逻辑：待办、当前猎物及专注累计均来自共享 localStorage 状态。
function render(){const s=state(),task=active();$('#prey').innerHTML=`当前猎物：<strong>${task?escapeHtml(task.title):'自由专注'}</strong>`;$('#total').textContent=todayMinutes();$('#todo-count').textContent=`剩余 ${s.todos.filter(t=>!t.completed).length} 个`;$('#todos').innerHTML=s.todos.map((t,i)=>`<article class="todo ${t.completed?'done':''}"><span class="bug-icon">${t.completed?'✅':bugs[i%bugs.length]}</span><div><span class="todo-title">${escapeHtml(t.title)}</span><div class="meta"><span class="priority ${t.priority}">${({high:'高',medium:'中',low:'低'})[t.priority]}</span> 已专注 ${t.actualPomodoros||0} 个番茄钟</div></div><button class="start-task" data-id="${t.id}" ${t.completed?'disabled':''}>🔨 开始啄</button></article>`).join('')||'<p class="subtle">暂无猎物，添加一件小事开始吧。</p>';renderTimer()}function escapeHtml(v){const e=document.createElement('span');e.textContent=v;return e.innerHTML}function start(){if(timerId)return;timerId=setInterval(()=>{left--;renderTimer();if(left<=0)finish()},1000);$('#timer-bird').classList.add('pecking')}function pause(){if(!timerId)return;clearInterval(timerId);timerId=null;$('#timer-bird').classList.remove('pecking')}function reset(){pause();left=DURATION;renderTimer()}// PeckPower 逻辑：倒计时自然归零才算完成，任务会被啄掉并奖励 10 果实。
function finish(){try{pause();const task=active();PeakPower.update(s=>{s.sessions.push({id:makeId(),todoId:task?.id||null,status:'completed',date:PeakPower.localDate(),durationMinutes:25});if(task){const t=s.todos.find(x=>x.id===task.id);t.actualPomodoros=(t.actualPomodoros||0)+1;t.completed=true;s.profile.points+=10;s.activeTodoId=null}});left=DURATION;render();PeakPower.bird('happy');PeakPower.peckSound();PeakPower.notify(task?`笃！成功啄掉 ${task.title}！+10 果实 🍎`:'笃！完成一个自由专注番茄钟！')}catch(error){console.error(error);PeakPower.notify('专注记录保存失败。')}}function choose(id){PeakPower.update(s=>s.activeTodoId=id);render();window.scrollTo({top:0,behavior:'smooth'});PeakPower.notify('猎物已锁定，开始啄食吧！')}$('#todos').onclick=e=>{const b=e.target.closest('.start-task');if(b)choose(b.dataset.id)};$('#start').onclick=start;$('#pause').onclick=pause;$('#reset').onclick=reset;$('#form').onsubmit=e=>{e.preventDefault();try{const title=$('#title').value.trim();if(!title)return;PeakPower.update(s=>s.todos.unshift({id:makeId(),title,priority:$('#priority').value,completed:false,actualPomodoros:0}));e.target.reset();render();PeakPower.notify('新猎物已加入清单。')}catch(error){console.error(error);PeakPower.notify('添加任务失败，请重试。')}};render();
</script></body></html>
