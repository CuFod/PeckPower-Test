<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>PeckPower｜我的</title><link rel="stylesheet" href="peckpower.css"><style>.profile{padding:30px;text-align:center}.avatar{width:92px;height:92px;display:grid;place-items:center;margin:auto;background:var(--wood-light-color);border:6px solid var(--white-color);border-radius:50%;font-size:3.4rem;box-shadow:0 10px 22px var(--shadow-color)}.profile h1{margin:13px 0 4px}.profile p{color:var(--muted-color)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.fact{padding:15px;background:var(--glass-color);border-radius:14px}.fact strong{display:block;color:var(--primary-dark-color);font-size:1.5rem}.favorites{margin-top:20px;padding:22px}.favorites h2{margin:0 0 13px;color:var(--primary-dark-color);font-size:1.15rem}.tag{display:inline-block;margin:4px;padding:7px 10px;color:var(--primary-dark-color);font-weight:800;background:var(--wood-light-color);border-radius:99px}@media(max-width:500px){.profile{padding:22px}.avatar{width:78px;height:78px;font-size:2.8rem}.facts{grid-template-columns:repeat(3,1fr);gap:7px}.fact{padding:11px 6px;font-size:.8rem}.fact strong{font-size:1.3rem}.favorites{padding:18px}}@media(max-width:340px){.facts{grid-template-columns:1fr}.fact{font-size:.9rem}}</style></head><body><main class="page"><section class="profile wood-card"><div class="avatar">🐦</div><h1 id="name" class="page-title"></h1><p>积小成多，啄去难题。</p><div class="facts"><div class="fact"><strong id="points">0</strong>果实</div><div class="fact"><strong id="words">0</strong>已掌握</div><div class="fact"><strong id="sessions">0</strong>专注钟</div></div></section><section class="favorites glass-card"><h2>⭐ 我的树洞收藏</h2><div id="favorites" class="subtle">还没有收藏的难词。</div></section></main><script src="peckpower.js"></script><script>// PeckPower 逻辑：个人页读取统一状态，展示成长数据与树洞收藏。
PeckPower.mountGlobal('profile');const s=PeckPower.getState();document.querySelector('#name').textContent=s.profile.name;document.querySelector('#points').textContent=s.profile.points;document.querySelector('#words').textContent=s.wordProgress.masteredWords.length;document.querySelector('#sessions').textContent=s.sessions.filter(x=>x.status==='completed').length;if(s.wordProgress.favorites.length)document.querySelector('#favorites').innerHTML=s.wordProgress.favorites.map(x=>`<span class="tag">${x}</span>`).join('');</script></body></html>
