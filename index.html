<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>PeckPower｜词库</title><link rel="stylesheet" href="peckpower.css"><style>
.word-head{display:grid;grid-template-columns:auto 1fr 70px;gap:14px;align-items:center;padding:14px 18px}.exam-tabs{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}.exam-tabs button{position:relative;padding:7px 9px;color:var(--muted-color);font-weight:800;background:transparent;border:0}.exam-tabs button.active{color:var(--primary-dark-color)}.exam-tabs button.active::after{position:absolute;right:50%;bottom:-4px;width:10px;height:6px;content:"";background:var(--red-color);clip-path:polygon(0 0,50% 100%,100% 0);transform:translateX(50%)}.tree-progress{height:88px;position:relative;overflow:visible;background:linear-gradient(90deg,var(--wood-dark-color),var(--wood-color),var(--wood-dark-color));border:4px solid var(--wood-dark-color);border-radius:30px}.tree-progress::before{position:absolute;top:-17px;left:-11px;width:84px;height:27px;content:"🌿🌿";font-size:23px;letter-spacing:-14px}.tree-progress::after{position:absolute;bottom:-14px;left:11px;content:"〰〰";color:var(--wood-dark-color);font-size:28px}.tree-fill{position:absolute;right:6px;bottom:5px;left:6px;height:0%;background:repeating-linear-gradient(0deg,var(--red-color) 0 7px,transparent 8px 13px);border-radius:20px;transition:height .45s ease}.tree-bird{position:absolute;right:50%;bottom:0%;z-index:2;font-size:26px;filter:drop-shadow(0 2px 1px var(--shadow-color));transform:translateX(50%);transition:bottom .45s ease}.progress-label{margin-top:4px;color:var(--primary-dark-color);font-size:.68rem;font-weight:900;text-align:center}.word-area{display:grid;gap:12px;justify-items:center;margin-top:15px}.card-wrap{width:min(100%,650px);min-height:330px;perspective:1000px}.word-card{width:100%;min-height:330px;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .62s ease}.word-card.flipped{transform:rotateY(180deg)}.face{min-height:330px;position:absolute;inset:0;padding:29px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden}.face::before{position:absolute;top:20px;left:22px;width:20px;height:20px;content:"";background:var(--red-color);border-radius:50%;box-shadow:inset 3px 3px 5px var(--wood-dark-color)}.back{align-items:stretch;justify-content:space-between;transform:rotateY(180deg);text-align:left}.back dl{margin:0}.back dt{margin-top:8px;color:var(--primary-color);font-size:.82rem;font-weight:900}.back dd{margin:4px 0 9px;line-height:1.55}.word-type{color:var(--red-color);font-size:.82rem;font-weight:900;letter-spacing:.13em}.word{margin:13px 0;color:var(--primary-dark-color);font-family:Georgia,serif;font-size:clamp(3rem,10vw,4.6rem);word-break:break-word}.tip{margin:4px 0;color:var(--muted-color);font-size:.88rem}.back .tip{padding-top:10px;text-align:center;border-top:1px solid var(--bark-color)}.word-actions{width:min(100%,650px);display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.word-actions button{min-height:68px;padding:8px;color:var(--white-color);font-weight:900;border:0;border-radius:15px;box-shadow:0 7px 14px var(--shadow-color)}.word-actions button span{display:block;margin-bottom:4px;font-size:1.18rem}.pest{background:var(--red-color)}.review{background:var(--orange-color)}.master{background:var(--teal-color)}.utility{display:flex;gap:9px}.utility button{padding:9px 12px;color:var(--primary-dark-color);font-weight:800;background:var(--glass-color);border:1px solid var(--glass-border-color);border-radius:11px}.message{min-height:1.3rem;margin:0;font-weight:800;color:var(--primary-dark-color)}.impact{position:fixed;top:50%;left:50%;z-index:80;color:var(--red-color);font-size:clamp(3rem,13vw,6rem);font-weight:900;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.2)}.impact.show{animation:impact .8s ease-out}.shake{animation:shake .42s linear}@keyframes impact{25%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}@keyframes shake{20%,60%{translate:-7px 0}40%,80%{translate:7px 0}}.chip{position:fixed;z-index:70;width:9px;height:9px;background:var(--wood-dark-color);pointer-events:none;animation:chip .8s ease-out forwards}@keyframes chip{to{translate:var(--x) var(--y);rotate:var(--r);opacity:0}}.fruit-rain{position:fixed;top:-30px;z-index:85;font-size:28px;animation:fruit 1.8s linear forwards}@keyframes fruit{to{translate:var(--x) 110vh;rotate:540deg}}@media(max-width:700px){.word-head{grid-template-columns:1fr;gap:10px;padding:18px 22px}.tree-progress{width:70px;height:100px;justify-self:center}.word-area{gap:16px;margin-top:22px}.card-wrap,.word-card,.face{min-height:400px}.face{padding:28px 23px}.word-actions{gap:7px}.word-actions button{font-size:.78rem}.utility{flex-wrap:wrap}}@media(max-width:420px){.word-head{padding:16px}.exam-tabs{display:grid;grid-template-columns:repeat(5,1fr);width:100%;gap:2px}.exam-tabs button{padding:8px 2px;font-size:.76rem}.card-wrap,.word-card,.face{min-height:370px}.face{padding:24px 18px}.word-actions{grid-template-columns:1fr;gap:8px}.word-actions button{min-height:54px;display:flex;align-items:center;justify-content:center;gap:7px}.word-actions button span{display:inline;margin:0}.utility{width:100%;display:grid;grid-template-columns:1fr 1fr}.utility button{min-height:44px}}@media(max-height:540px) and (orientation:landscape){.word-head{grid-template-columns:auto 1fr 70px;padding:12px 18px}.word-area{margin-top:12px;gap:10px}.card-wrap,.word-card,.face{min-height:300px}.face{padding:20px}.word{font-size:3rem}.word-actions{grid-template-columns:repeat(3,1fr)}.word-actions button{min-height:52px}}
</style></head><body><main class="page"><header class="word-head glass-card"><h1 class="page-title">📚 词库</h1><div id="tabs" class="exam-tabs" aria-label="考试词库"></div><aside><div class="tree-progress"><div id="tree-fill" class="tree-fill"></div><span id="tree-bird" class="tree-bird">🐦</span></div><div id="progress-text" class="progress-label">0/20</div></aside></header><section class="word-area"><div class="card-wrap"><article id="card" class="word-card" tabindex="0" role="button" aria-label="翻转单词卡"><div class="face wood-card"><span id="type" class="word-type"></span><h2 id="word" class="word"></h2><p class="tip">轻触卡片，翻开答案</p></div><div class="face back wood-card"><dl><dt>音标</dt><dd id="phonetic"></dd><dt>中文释义</dt><dd id="meaning"></dd><dt>真题例句</dt><dd id="example"></dd></dl><p class="tip">再点一次，返回单词正面</p></div></article></div><div class="word-actions"><button class="pest" data-answer="pest"><span>🐛</span>害虫！需要再啄</button><button class="review" data-answer="review"><span>🔄</span>再观察一下</button><button class="master" data-answer="master"><span>🪚</span>啄掉了！</button></div><div class="utility"><button id="speak">🔊 朗读单词</button><button id="favorite">⭐ 收藏到树洞</button></div><p id="message" class="message" aria-live="polite"></p></section></main><div id="impact" class="impact">笃！💥</div><script src="peckpower.js"></script><script>
// PeckPower 逻辑：20 个高考/四级样例词由前端轮换展示，后续可替换为接口数据。
const banks={高考:[['resilient','/rɪˈzɪliənt/','有韧性的；能迅速恢复的','Children are often remarkably resilient.'],['perspective','/pəˈspektɪv/','观点；视角','Try to see the problem from a different perspective.'],['contribute','/kənˈtrɪbjuːt/','贡献；促成','Everyone can contribute to a cleaner school.'],['significant','/sɪɡˈnɪfɪkənt/','重要的；显著的','The project has made significant progress.'],['approach','/əˈprəʊtʃ/','方法；接近','We need a new approach to learning English.'],['allocate','/ˈæləkeɪt/','分配；拨给','Allocate enough time to revision.'],['enhance','/ɪnˈhɑːns/','提高；增强','Reading enhances your vocabulary.'],['crucial','/ˈkruːʃl/','至关重要的','Sleep is crucial for learning.'],['overcome','/ˌəʊvəˈkʌm/','克服','She overcame every difficulty.'],['diverse','/daɪˈvɜːs/','多样的','The club has diverse activities.']],四级:[['sustain','/səˈsteɪn/','维持；支撑','Fresh water sustains life.'],['inevitable','/ɪnˈevɪtəbl/','不可避免的','Some change is inevitable.'],['relevant','/ˈreləvənt/','相关的','Please provide relevant information.'],['advocate','/ˈædvəkeɪt/','提倡；拥护者','They advocate protecting nature.'],['ambiguous','/æmˈbɪɡjuəs/','模棱两可的','His answer was ambiguous.'],['deteriorate','/dɪˈtɪəriəreɪt/','恶化','The weather deteriorated.'],['comprehensive','/ˌkɒmprɪˈhensɪv/','全面的','She has comprehensive knowledge.'],['controversial','/ˌkɒntrəˈvɜːʃl/','有争议的','The decision is controversial.'],['preliminary','/prɪˈlɪmɪnəri/','初步的','These are preliminary results.'],['facilitate','/fəˈsɪlɪteɪt/','促进；使便利','Technology facilitates learning.']]};const exams=Object.keys(banks);let exam='高考',index=0;PeckPower.mountGlobal('words');const $=s=>document.querySelector(s);function current(){const [word,phonetic,meaning,example]=banks[exam][index];return{word,phonetic,meaning,example,examType:exam}}function renderTabs(){$('#tabs').innerHTML=exams.map(x=>`<button class="${x===exam?'active':''}" data-exam="${x}">${x}</button>`).join('')}function render(){try{const item=current();$('#card').classList.remove('flipped');$('#type').textContent=`${item.examType}英语`;$('#word').textContent=item.word;$('#phonetic').textContent=item.phonetic;$('#meaning').textContent=item.meaning;$('#example').textContent=item.example;renderProgress()}catch(error){console.error(error);PeckPower.notify('词库加载失败，请重试。')}}function renderProgress(){const p=PeckPower.getState().wordProgress;const ratio=Math.min(20,p.masteredToday)/20*100;$('#tree-fill').style.height=`${ratio}%`;$('#tree-bird').style.bottom=`${ratio}%`;$('#progress-text').textContent=`${Math.min(20,p.masteredToday)}/20`}function particles(){const r=$('#card').getBoundingClientRect();for(let i=0;i<10;i++){const c=document.createElement('i');c.className='chip';c.style.left=`${r.left+r.width/2}px`;c.style.top=`${r.top+r.height/2}px`;c.style.setProperty('--x',`${(Math.random()-.5)*300}px`);c.style.setProperty('--y',`${(Math.random()-.5)*240+120}px`);c.style.setProperty('--r',`${Math.random()*540}deg`);document.body.append(c);setTimeout(()=>c.remove(),900)}}function fruitRain(){for(let i=0;i<9;i++){const f=document.createElement('span');f.className='fruit-rain';f.textContent='🍎';f.style.left=`${5+Math.random()*90}vw`;f.style.setProperty('--x',`${(Math.random()-.5)*120}px`);document.body.append(f);setTimeout(()=>f.remove(),1900)}}// PeckPower 逻辑：成功链依序执行角色啄食、卡片震动、粒子、音效和共享进度更新。
function answer(kind){try{const item=current();if(kind==='master'){PeckPower.bird('pecking');$('#card').classList.add('shake');$('#impact').classList.remove('show');void $('#impact').offsetWidth;$('#impact').classList.add('show');particles();PeckPower.peckSound();const state=PeckPower.update(s=>{if(!s.wordProgress.masteredWords.includes(item.word)){s.wordProgress.masteredWords.push(item.word);s.wordProgress.masteredToday=Math.min(20,s.wordProgress.masteredToday+1);s.wordProgress.weeklyWords=Math.min(100,(s.wordProgress.weeklyWords||68)+1);s.profile.points+=1}});$('#message').textContent=`${item.word} 已掌握，继续啄食！`;if(state.wordProgress.masteredToday===20){fruitRain();PeckPower.bird('happy');PeckPower.notify('笃！今日已啄掉 20 个单词 🎉')}renderProgress()}else if(kind==='pest'){$('#message').textContent=`${item.word} 已加入难啃清单。`;PeckPower.bird('pecking')}else{$('#message').textContent=`${item.word} 已放入明天复习。`}setTimeout(()=>{$('#card').classList.remove('shake');index=(index+1)%banks[exam].length;render()},450)}catch(error){console.error(error);PeckPower.notify('学习状态保存失败。')}}$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;exam=b.dataset.exam;index=0;renderTabs();render()};$('#card').onclick=()=>$('#card').classList.toggle('flipped');$('#card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#card').classList.toggle('flipped')}};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));$('#speak').onclick=()=>{try{const u=new SpeechSynthesisUtterance(current().word);u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(error){PeckPower.notify('当前浏览器无法朗读单词。')}};$('#favorite').onclick=()=>{try{const item=current();PeckPower.update(s=>{if(!s.wordProgress.favorites.includes(item.word))s.wordProgress.favorites.push(item.word)});$('#message').textContent=`${item.word} 已收藏到树洞。`}catch(error){PeckPower.notify('收藏失败，请稍后重试。')}};renderTabs();render();
</script></body></html>
